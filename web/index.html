const NAMES={energy:"Energy charges",fixed:"Fixed charges",fpa:"Fuel price adjustment",quarterly_adjustment:"Quarterly adjustment",surcharge:"Surcharge",meter_rent:"Meter rent",subsidy:"Subsidy",other:"Other",gst:"Sales tax (GST)",electricity_duty:"Electricity duty",income_tax:"Income tax",municipal_tax:"Municipal tax",other_tax:"Other tax"};
const S={res:null,lang:"en",tr:{},QS:{},billUrl:null};
const t=k=>I18N[S.lang][k]??I18N.en[k]??k;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n==null?t("na"):(n<0?"-":"")+"Rs "+Math.abs(n).toLocaleString("en-PK",{maximumFractionDigits:2});
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mlabel=m=>m?MON[+m.slice(5)-1]+" "+m.slice(0,4):"—";

/* ---------- language / theme ---------- */
function applyI18n(){document.documentElement.dir=S.lang==="ur"?"rtl":"ltr";$$("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 $("#xpdf").textContent=t("pdf");$("#xcsv").textContent=t("csv");$("#xcard").textContent=t("card");$("#q").placeholder=t("ask_ph");
 $$("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===S.lang));
 $("#chips").innerHTML=["sg1","sg2","sg3"].map(k=>`<button class="chip" data-q="${k}">${esc(t(k))}</button>`).join("")}
async function setLang(l){S.lang=l;applyI18n();if(S.res){render();if(l!=="en")await loadTranslation(l)}}
async function loadTranslation(l){
 if(!S.tr[l]){const n=document.createElement("div");n.className="pill";n.id="trn";n.innerHTML='<span class="spin"></span> '+esc(t("translating"));$(".topbar").appendChild(n);
  try{const r=await fetch("/api/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bill_key:S.res.bill_key,lang:l})});const d=await r.json();if(r.ok)S.tr[l]=d}catch(e){}n.remove()}
 if(S.lang===l&&S.tr[l])render()}
$("#langs").onclick=e=>e.target.dataset.l&&setLang(e.target.dataset.l);
$("#theme").onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";localStorage.setItem("theme",h.dataset.theme);S.res&&render()};
try{const th=localStorage.getItem("theme");if(th)document.documentElement.dataset.theme=th}catch(e){}

/* ---------- boot ---------- */
fetch("/api/config").then(r=>r.json()).then(c=>{$("#model").textContent=c.model;c.questions.forEach(q=>S.QS[q.question_id]=q.question);if(!c.ready)$("#err").textContent="API_KEY missing. Add it to .env and restart."});
applyI18n();
const drop=$("#drop"),file=$("#file");drop.onclick=()=>file.click();
["dragover","dragenter"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("on")}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("on")}));
drop.addEventListener("drop",e=>e.dataTransfer.files[0]&&run(e.dataTransfer.files[0]));file.onchange=()=>file.files[0]&&run(file.files[0]);
$("#again").onclick=()=>{$("#out").classList.add("hide");$("#hero").classList.remove("hide");S.res=null;S.tr={};file.value="";scrollTo(0,0)};
let ticker;
function loading(on){const L=$("#load");L.classList.toggle("hide",!on);drop.classList.toggle("hide",on);clearInterval(ticker);if(!on)return;let i=0;
 const draw=()=>{L.innerHTML=["st1","st2","st3"].map((k,j)=>`<div class="ls ${j<i?"done":j===i?"on":""}">${j===i?'<span class="spin"></span>':""} ${esc(t(k))}</div>`).join("")+'<div class="skel" style="margin-top:12px"></div>'};draw();ticker=setInterval(()=>{i=Math.min(i+1,2);draw()},6000)}
async function run(f){
 $("#err").textContent="";loading(true);const fd=new FormData();fd.append("bill",f);
 try{const r=await fetch("/api/analyze",{method:"POST",body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||"Failed");
  S.res=d;S.tr={};S.billUrl=URL.createObjectURL(f);loading(false);$("#hero").classList.add("hide");$("#out").classList.remove("hide");scrollTo(0,0);render();if(S.lang!=="en")loadTranslation(S.lang)}
 catch(e){loading(false);$("#err").textContent=e.message}}

/* ---------- render ---------- */
const tr=()=>S.tr[S.lang];
function stat(l,v,s,c=""){return `<div class="card stat ${c}"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s||"")}</div></div>`}
function lines(el,arr,total){el.innerHTML=(arr.length?arr.map(x=>`<div class="row"><span>${esc(NAMES[x.type]||x.type)}</span><b class="${x.amount<0?"neg":""}">${fmt(x.amount)}</b></div>`).join(""):`<div class="mu">${esc(t("none"))}</div>`)+`<div class="row"><span><b>${esc(t("total"))}</b></span><b>${fmt(total)}</b></div>`}
function render(){const d=S.res,l=d.level1,ins=d.insights;
 $("#meta").textContent=[l.provider,l.tariff,mlabel(l.bill_month)].filter(Boolean).join(" · ");
 $("#stats").innerHTML=stat(t("pay_by"),fmt(l.payable_within_due_date),t("due")+": "+(l.due_date||"—"),"hl")+stat(t("after"),fmt(l.payable_after_due_date),"")+stat(t("units"),l.units_consumed??"—",(l.sanctioned_load_kw!=null?l.sanctioned_load_kw+" kW":""))+stat(t("this_bill"),fmt(l.current_bill),t("bill_month")+": "+mlabel(l.bill_month));
 $("#prev").src=S.billUrl;
 const c=l.total_charges,x=l.total_taxes,tot=(c||0)+(x||0);
 $("#split").innerHTML=tot>0?`<div class="bar"><i style="width:${c/tot*100}%;background:var(--ac)"></i><i style="width:${x/tot*100}%;background:var(--cy)"></i></div><div class="row"><span style="color:var(--ac)">● ${esc(t("elec"))}</span><b>${fmt(c)} (${(c/tot*100).toFixed(1)}%)</b></div><div class="row"><span style="color:var(--cy)">● ${esc(t("taxd"))}</span><b>${fmt(x)} (${(x/tot*100).toFixed(1)}%)</b></div>`:`<span class="mu">${esc(t("none"))}</span>`;
 lines($("#charges"),l.charges,l.total_charges);lines($("#taxes"),l.taxes,l.total_taxes);
 $("#warnings").innerHTML=d.warnings.map(w=>`<div class="warn">${esc(w)}</div>`).join("");
 renderAlert(ins);renderChart(d.facts);renderWhatIf();renderTips(ins);renderQA(d);
 $("#json").textContent=JSON.stringify(l,null,2);
 $("#checks").innerHTML=(d.warnings.length?d.warnings.map(w=>`<div class="warn">${esc(w)}</div>`).join(""):`<div class="alert ok"><span class="ic" aria-hidden="true"></span><div>${esc(t("allgood"))}</div></div>`)}
function renderAlert(ins){const a=ins.slab_alert;
 const msg=(S.lang!=="en"&&tr())?tr().slab_message:a.message;
 $("#alert").innerHTML=`<div class="alert ${a.level}"><span class="ic" aria-hidden="true"></span><div><b>${a.available?"":""}${esc(msg)}</b></div></div>`}
function renderChart(f){
 const rows=f.history.filter(h=>h.units!=null).map(h=>({m:h.month,u:h.units,cur:false}));
 if(f.bill_month&&f.units_consumed!=null&&!rows.find(r=>r.m===f.bill_month))rows.push({m:f.bill_month,u:f.units_consumed,cur:true});
 rows.sort((a,b)=>a.m.localeCompare(b.m));if(!rows.length){$("#chart").innerHTML=`<span class="mu">${esc(t("unavail"))}</span>`;return}
 const hist=rows.filter(r=>!r.cur).slice(-12),avg=hist.length?hist.reduce((s,r)=>s+r.u,0)/hist.length:null;
 const W=1000,H=250,p=30,mx=Math.max(...rows.map(r=>r.u),1),mn=Math.min(0,...rows.map(r=>r.u)),bw=(W-p*2)/rows.length,y=v=>H-p-(v-mn)/(mx-mn||1)*(H-p*2);
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4cc9f0"/><stop offset="1" stop-color="#4cc9f0" stop-opacity=".35"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb020"/><stop offset="1" stop-color="#ff6b8b"/></linearGradient></defs>`;
 rows.forEach((r,i)=>{const x=p+i*bw+5,top=Math.min(y(r.u),y(0)),h=Math.max(Math.abs(y(r.u)-y(0)),1);
  s+=`<rect x="${x}" y="${top}" width="${bw-10}" height="${h}" rx="6" fill="url(#${r.cur?"g2":"g1"})"><title>${mlabel(r.m)}: ${r.u} units</title></rect><text x="${x+(bw-10)/2}" y="${top-6}" fill="var(--tx)" font-size="13" text-anchor="middle">${r.u}</text><text x="${x+(bw-10)/2}" y="${H-8}" fill="var(--mu)" font-size="12" text-anchor="middle">${MON[+r.m.slice(5)-1]} ${r.m.slice(2,4)}</text>`});
 if(avg!=null)s+=`<line x1="${p}" x2="${W-p}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--ac2)" stroke-dasharray="6 5" stroke-width="2"/><text x="${W-p}" y="${y(avg)-6}" fill="var(--ac2)" font-size="12" text-anchor="end">${esc(t("avg"))}: ${avg.toFixed(0)}</text>`;
 $("#chart").innerHTML=s+"</svg>"}
function renderTips(ins){const T=(S.lang!=="en"&&tr());
 $("#tips").innerHTML=ins.tips.map((x,i)=>`<div class="tip"><b>${esc(T?T.tip_titles[i]:x.title)}</b><span>${esc(T?T.tip_texts[i]:x.text)}</span>${x.saving_pkr?`<div><span class="sv">≈ Rs ${x.saving_pkr.toLocaleString()}</span></div>`:""}</div>`).join("")}
function renderQA(d){const T=(S.lang!=="en"&&tr());
 $("#qa").innerHTML=Object.entries(d.answers||{}).map(([id,a])=>{const m=(d.answer_meta||{})[id]||{};return `<details><summary>${esc(S.QS[id]||id)}<span class="vb ${m.verified?"":"no"}">${esc(m.verified?(m.source==="computed"?t("calc"):t("verified")):t("unv"))}</span></summary><p>${esc(T?T.answers[id]:a)}</p></details>`}).join("")}

/* ---------- what-if ---------- */
let wiTimer;
function renderWhatIf(){const m=S.res.insights.cost_model,box=$("#wi");
 if(!m){box.innerHTML=`<span class="mu">${esc(t("unavail"))}</span>`;$("#curve").innerHTML=`<span class="mu">${esc(t("unavail"))}</span>`;return}
 const max=Math.max(Math.round(m.units*2),100);
 box.innerHTML=`<div class="mu">${esc(t("units"))}: <b id="wu" style="color:var(--tx)">${Math.round(m.units)}</b></div><input class="slider" id="ws" type="range" min="0" max="${max}" step="1" value="${Math.round(m.units)}"><div class="mu">${esc(t("est"))}</div><div class="big" id="wb">${fmt(m.bill)}</div><div id="wd" class="delta"></div><p class="mu" id="wn" style="font-size:12.5px"></p>`;
 $("#ws").oninput=e=>{$("#wu").textContent=e.target.value;clearTimeout(wiTimer);wiTimer=setTimeout(()=>whatIf(+e.target.value),120);drawCurve(+e.target.value)};
 drawCurve(m.units);whatIf(m.units)}
async function whatIf(u){try{const r=await fetch("/api/whatif",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bill_key:S.res.bill_key,units:u})});const d=await r.json();if(!d.available)return;
 $("#wb").textContent=fmt(d.estimated_bill);const dd=$("#wd");dd.className="delta "+(d.delta>0?"up":"dn");dd.textContent=(d.delta>=0?"+":"")+fmt(d.delta).replace("Rs ","Rs ")+" ("+(d.delta_pct>=0?"+":"")+d.delta_pct+"%) "+t("vs");$("#wn").textContent=(d.slab_note||"")+" "+d.method}catch(e){}}
function drawCurve(sel){const pts=S.res.insights.curve,m=S.res.insights.cost_model;if(!pts.length)return;
 const W=500,H=220,p=30,mx=pts.at(-1).units,my=Math.max(...pts.map(q=>q.bill)),X=v=>p+v/mx*(W-p*2),Y=v=>H-p-v/my*(H-p*2),est=m.fixed+m.rate_per_unit*sel;
 const path=pts.map((q,i)=>(i?"L":"M")+X(q.units)+" "+Y(q.bill)).join(" ");
 $("#curve").innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><path d="${path}" fill="none" stroke="var(--cy)" stroke-width="3"/><circle cx="${X(m.units)}" cy="${Y(m.bill)}" r="6" fill="var(--ac)"><title>This bill</title></circle><circle cx="${X(sel)}" cy="${Y(est)}" r="7" fill="var(--ac2)"/><line x1="${p}" x2="${W-p}" y1="${H-p}" y2="${H-p}" stroke="var(--line)"/><text x="${p}" y="${H-8}" fill="var(--mu)" font-size="11">0</text><text x="${W-p}" y="${H-8}" fill="var(--mu)" font-size="11" text-anchor="end">${Math.round(mx)} units</text><text x="${X(m.units)}" y="${Y(m.bill)-12}" fill="var(--ac)" font-size="11" text-anchor="middle">●</text></svg>`}

/* ---------- ask ---------- */
async function ask(q){if(!q.trim()||!S.res)return;const c=$("#chat");c.insertAdjacentHTML("beforeend",`<div class="msg me">${esc(q)}</div>`);$("#q").value="";
 const el=document.createElement("div");el.className="msg bot";el.innerHTML='<span class="spin"></span> '+esc(t("think"));c.appendChild(el);c.scrollTop=1e6;
 try{const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bill_key:S.res.bill_key,question:q})});const d=await r.json();el.textContent=r.ok?d.answer:d.error;
  if(r.ok){const b=document.createElement("span");b.className="vb "+(d.verified?"":"no");b.textContent=d.verified?t("verified"):t("unv");el.appendChild(document.createElement("br"));el.appendChild(b)}}
 catch(e){el.textContent="Network error."}c.scrollTop=1e6}
$("#send").onclick=()=>ask($("#q").value);$("#q").onkeydown=e=>e.key==="Enter"&&ask($("#q").value);
$("#chips").onclick=e=>{const k=e.target.dataset.q;if(k){S.tabQA=1;ask(I18N.en[k])}};
$("#tabs").onclick=e=>{const k=e.target.dataset.t;if(!k)return;$$(".tab").forEach(b=>b.classList.toggle("on",b===e.target));$$(".pane").forEach(p=>p.classList.toggle("on",p.id==="p-"+k))};
$("#copy").onclick=()=>navigator.clipboard.writeText($("#json").textContent);

/* ---------- export ---------- */
$("#xpdf").onclick=()=>location.href="/api/export/pdf/"+S.res.bill_key;
$("#xcsv").onclick=()=>location.href="/api/export/csv/"+S.res.bill_key;
$("#xcard").onclick=()=>{const c=makeCard();c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="bill-summary-"+(S.res.level1.bill_month||"card")+".png";a.click()})};
function makeCard(){const l=S.res.level1,f=S.res.facts,c=document.createElement("canvas");c.width=1200;c.height=630;const x=c.getContext("2d");
 const g=x.createLinearGradient(0,0,1200,630);g.addColorStop(0,"#0a0f1f");g.addColorStop(1,"#1b2650");x.fillStyle=g;x.fillRect(0,0,1200,630);
 const r=x.createRadialGradient(1050,60,10,1050,60,420);r.addColorStop(0,"rgba(255,176,32,.35)");r.addColorStop(1,"rgba(255,176,32,0)");x.fillStyle=r;x.fillRect(0,0,1200,630);
 const F="'Segoe UI',system-ui,sans-serif";x.fillStyle="#ffb020";x.font=`800 30px ${F}`;x.fillText("Utility Bill Decoder",60,80);
 x.fillStyle="#98a3c7";x.font=`600 24px ${F}`;x.fillText([l.provider,l.tariff,mlabel(l.bill_month)].filter(Boolean).join("  ·  "),60,125);
 x.fillStyle="#eef1fb";x.font=`800 88px ${F}`;x.fillText(fmt(l.payable_within_due_date),60,250);
 x.fillStyle="#98a3c7";x.font=`500 26px ${F}`;x.fillText("to pay by "+(l.due_date||"the due date"),64,292);
 const tax=l.total_taxes&&l.current_bill?(l.total_taxes/l.current_bill*100).toFixed(1)+"%":"—";
 const hist=f.history.filter(h=>h.units!=null).slice(-12),avg=hist.length?hist.reduce((s,h)=>s+h.units,0)/hist.length:null;
 const tiles=[["Units used",l.units_consumed??"—"],["Taxes share",tax],["12-mo avg",avg!=null?Math.round(avg)+" units":"—"]];
 tiles.forEach((tl,i)=>{const X=60+i*230;x.fillStyle="rgba(255,255,255,.07)";x.beginPath();x.roundRect(X,350,210,110,18);x.fill();x.fillStyle="#98a3c7";x.font=`500 20px ${F}`;x.fillText(tl[0],X+18,386);x.fillStyle="#eef1fb";x.font=`800 34px ${F}`;x.fillText(String(tl[1]),X+18,435)});
 const rows=[...hist.map(h=>h.units)];if(l.units_consumed!=null)rows.push(l.units_consumed);const mx=Math.max(...rows,1),bw=380/Math.max(rows.length,1);
 rows.forEach((v,i)=>{const h=Math.max(v/mx*210,3),X=760+i*bw,last=i===rows.length-1;const gg=x.createLinearGradient(0,0,0,1);x.fillStyle=last?"#ff8a3d":"#4cc9f0";x.globalAlpha=last?1:.8;x.beginPath();x.roundRect(X+3,500-h,bw-8,h,5);x.fill();x.globalAlpha=1});
 x.fillStyle="#98a3c7";x.font=`500 18px ${F}`;x.fillText("Units per month",760,525);x.fillText("Decoded with AI · no personal data",60,590);return c}
</script></body></html>
